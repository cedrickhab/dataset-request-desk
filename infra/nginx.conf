# Single origin: static assets and /api are served from the same host and
# port, so the session cookie is first-party and SameSite=Lax is enough.

upstream api_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # The CSV upload limit. Nginx rejects anything larger before it reaches
    # Django, so an oversized body never occupies an application worker.
    client_max_body_size 11m;

    # Do not advertise the nginx version.
    server_tokens off;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        # Vite fingerprints asset filenames, so these are safe to cache hard.
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        root /usr/share/nginx/html;
        # Client-side routing: unknown paths return index.html, never a 404
        # page, so a deep link like /requests/<id> resolves.
        try_files $uri $uri/ /index.html;
        # index.html itself must not be cached, or a deploy serves stale
        # references to fingerprinted assets that no longer exist.
        add_header Cache-Control "no-cache";
    }
}
