name: CI

# Runs on pushes and pull requests. CI reports on a commit that already
# exists; it cannot retroactively block a push, so a red run is fixed by
# another tested commit, never by rewriting history.
on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref cancels an in-flight run for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Pinned to the same major version the application runs on, because
        # the suite depends on real PostgreSQL locking and percentile_cont.
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: dataset_desk_test
          POSTGRES_USER: dataset_desk
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataset_desk -d dataset_desk_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: test-only-secret-key-not-used-outside-ci
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_SECURE_COOKIES: "false"
      POSTGRES_DB: dataset_desk_test
      POSTGRES_USER: dataset_desk
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      LOG_FORMAT: plain
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Ruff
        run: ruff check .
        working-directory: backend

      - name: Django checks
        run: python manage.py check --fail-level WARNING
        working-directory: backend

      - name: Migration drift
        run: python manage.py makemigrations --check --dry-run
        working-directory: backend

      - name: Migrations apply to a fresh database
        run: python manage.py migrate --no-input
        working-directory: backend

      - name: Seeding is idempotent
        # Twice: the second run must create nothing and change no password.
        run: |
          python manage.py seed_users
          python manage.py seed_users
        working-directory: backend

      - name: Tests
        run: pytest tests/
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Tests
        run: npm run test -- --run
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  clean-startup:
    # Proves `docker compose up` works from a clean checkout: migrations,
    # seeding, API, worker and the proxied frontend.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a local .env
        run: |
          cat > .env <<'ENV'
          DJANGO_SECRET_KEY=ci-only-secret-key
          DJANGO_DEBUG=false
          DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,api,web
          DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost:8080
          DJANGO_SECURE_COOKIES=false
          POSTGRES_DB=dataset_desk
          POSTGRES_USER=dataset_desk
          POSTGRES_PASSWORD=ci-only-password
          ENV

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: The frontend is served
        run: |
          curl --fail --silent --show-error http://localhost:8080/ | grep -qi "<!doctype html" \
            || { echo "frontend did not serve index.html"; exit 1; }

      - name: Health requires authentication
        run: |
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                   http://localhost:8080/health)
          test "$code" = "401" || { echo "expected 401 from /health, got $code"; exit 1; }

      - name: A seeded account can log in through the proxy
        run: |
          jar=$(mktemp)
          token=$(curl --fail --silent --cookie-jar "$jar" \
                    http://localhost:8080/api/auth/csrf | sed -n 's/.*"csrf_token":"\([^"]*\)".*/\1/p')
          test -n "$token" || { echo "no csrf token"; exit 1; }
          curl --fail --silent --show-error \
            --cookie "$jar" --cookie-jar "$jar" \
            -H "Content-Type: application/json" \
            -H "X-CSRFToken: $token" \
            -H "Referer: http://localhost:8080/" \
            -d '{"email":"ops1@example.com","password":"ops123"}' \
            http://localhost:8080/api/auth/login > /dev/null
          code=$(curl --silent --cookie "$jar" --output /dev/null \
                   --write-out '%{http_code}' http://localhost:8080/health)
          test "$code" = "200" || { echo "expected 200 from /health when logged in, got $code"; exit 1; }

      - name: The worker is running
        run: |
          docker compose logs worker | grep -q "worker started" \
            || { docker compose logs worker; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
